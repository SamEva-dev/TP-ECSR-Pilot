@if (open()) {
  <button type="button" class="fixed inset-0 z-[60] bg-[#0f1c2e]/35 backdrop-blur-[1px]" (click)="closed.emit()" [attr.aria-label]="'sites.drawer.close' | t"></button>
  <aside class="fixed inset-y-0 right-0 z-[70] flex w-full max-w-[540px] flex-col bg-[#f7f9fc] shadow-[-18px_0_50px_rgba(17,34,57,0.18)]">
    <header class="flex items-start justify-between border-b border-[#dfe5ec] bg-white px-6 py-5">
      <div>
        <div class="inline-flex items-center gap-2 rounded-full bg-[#e7f1fb] px-3 py-1 text-[10.5px] font-bold uppercase tracking-[0.06em] text-[#245c97]"><i class="ph ph-buildings text-[14px]"></i>{{ (site() ? 'sites.drawer.editBadge' : 'sites.drawer.addBadge') | t }}</div>
        <h2 class="mt-2 text-[22px] font-extrabold tracking-[-0.5px] text-[#172033]">{{ (site() ? 'sites.drawer.editTitle' : 'sites.drawer.addTitle') | t }}</h2>
        <p class="mt-1 text-[12.5px] text-[#748095]">{{ 'sites.drawer.subtitle' | t }}</p>
      </div>
      <button type="button" (click)="closed.emit()" class="grid size-10 place-items-center rounded-[12px] border border-[#dde4ec] bg-white text-[#64748b] transition hover:bg-[#f2f5f8]"><i class="ph ph-x text-[18px]"></i></button>
    </header>

    <form class="flex min-h-0 flex-1 flex-col" [formGroup]="form" (ngSubmit)="submit()">
      <div class="flex-1 overflow-y-auto p-6">
        <div class="rounded-[18px] border border-[#dfe5ec] bg-white p-5 shadow-sm">
          <h3 class="text-[14px] font-bold text-[#172033]">{{ 'sites.drawer.identity' | t }}</h3>
          <div class="mt-4 grid gap-4 sm:grid-cols-[140px_1fr]">
            <label class="block"><span class="mb-2 block text-[11px] font-bold uppercase tracking-[0.04em] text-[#687589]">{{ 'sites.fields.code' | t }}</span><input formControlName="code" class="h-11 w-full rounded-[11px] border border-[#d9e1ea] px-3 text-[13px] outline-none focus:border-[#8eafd2] focus:ring-2 focus:ring-blue-100" /></label>
            <label class="block"><span class="mb-2 block text-[11px] font-bold uppercase tracking-[0.04em] text-[#687589]">{{ 'sites.fields.name' | t }}</span><input formControlName="name" class="h-11 w-full rounded-[11px] border border-[#d9e1ea] px-3 text-[13px] outline-none focus:border-[#8eafd2] focus:ring-2 focus:ring-blue-100" /></label>
          </div>
          <div class="mt-4 grid gap-4 sm:grid-cols-2">
            <label class="block"><span class="mb-2 block text-[11px] font-bold uppercase tracking-[0.04em] text-[#687589]">{{ 'sites.fields.city' | t }}</span><input formControlName="city" class="h-11 w-full rounded-[11px] border border-[#d9e1ea] px-3 text-[13px] outline-none focus:border-[#8eafd2] focus:ring-2 focus:ring-blue-100" /></label>
            <label class="block"><span class="mb-2 block text-[11px] font-bold uppercase tracking-[0.04em] text-[#687589]">{{ 'sites.fields.postalCode' | t }}</span><input formControlName="postalCode" class="h-11 w-full rounded-[11px] border border-[#d9e1ea] px-3 text-[13px] outline-none focus:border-[#8eafd2] focus:ring-2 focus:ring-blue-100" /></label>
          </div>
          <label class="mt-4 block"><span class="mb-2 block text-[11px] font-bold uppercase tracking-[0.04em] text-[#687589]">{{ 'sites.fields.address' | t }}</span><input formControlName="address" class="h-11 w-full rounded-[11px] border border-[#d9e1ea] px-3 text-[13px] outline-none focus:border-[#8eafd2] focus:ring-2 focus:ring-blue-100" /></label>
        </div>

        <div class="mt-4 rounded-[18px] border border-[#dfe5ec] bg-white p-5 shadow-sm">
          <h3 class="text-[14px] font-bold text-[#172033]">{{ 'sites.drawer.contact' | t }}</h3>
          <div class="mt-4 grid gap-4 sm:grid-cols-2">
            <label class="block"><span class="mb-2 block text-[11px] font-bold uppercase tracking-[0.04em] text-[#687589]">{{ 'sites.fields.phone' | t }}</span><input formControlName="phone" type="tel" class="h-11 w-full rounded-[11px] border border-[#d9e1ea] px-3 text-[13px] outline-none focus:border-[#8eafd2] focus:ring-2 focus:ring-blue-100" /></label>
            <label class="block"><span class="mb-2 block text-[11px] font-bold uppercase tracking-[0.04em] text-[#687589]">{{ 'sites.fields.email' | t }}</span><input formControlName="email" type="email" class="h-11 w-full rounded-[11px] border border-[#d9e1ea] px-3 text-[13px] outline-none focus:border-[#8eafd2] focus:ring-2 focus:ring-blue-100" /></label>
          </div>
          <label class="mt-4 block"><span class="mb-2 block text-[11px] font-bold uppercase tracking-[0.04em] text-[#687589]">{{ 'sites.fields.manager' | t }}</span><input formControlName="manager" class="h-11 w-full rounded-[11px] border border-[#d9e1ea] px-3 text-[13px] outline-none focus:border-[#8eafd2] focus:ring-2 focus:ring-blue-100" /></label>
          <label class="mt-4 block"><span class="mb-2 block text-[11px] font-bold uppercase tracking-[0.04em] text-[#687589]">{{ 'sites.fields.status' | t }}</span><select formControlName="status" class="h-11 w-full rounded-[11px] border border-[#d9e1ea] bg-white px-3 text-[13px] outline-none focus:border-[#8eafd2] focus:ring-2 focus:ring-blue-100"><option value="active">{{ 'sites.status.active' | t }}</option><option value="attention">{{ 'sites.status.attention' | t }}</option><option value="inactive">{{ 'sites.status.inactive' | t }}</option></select></label>
        </div>
      </div>

      <footer class="flex items-center justify-end gap-2 border-t border-[#dfe5ec] bg-white px-6 py-4">
        <button type="button" (click)="closed.emit()" class="h-10 rounded-[11px] border border-[#d8e0e9] bg-white px-4 text-[12px] font-semibold text-[#526075]">{{ 'common.cancel' | t }}</button>
        <button type="submit" class="inline-flex h-10 items-center gap-2 rounded-[11px] bg-[#2b66a4] px-4 text-[12px] font-semibold text-white shadow-sm"><i class="ph ph-check text-[15px]"></i>{{ (site() ? 'common.save' : 'sites.drawer.create') | t }}</button>
      </footer>
    </form>
  </aside>
}
