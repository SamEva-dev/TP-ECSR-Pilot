<div class="fixed inset-0 z-[90] bg-[#0f172a]/35" (click)="close()"></div>
<aside
  class="fixed inset-y-0 right-0 z-[100] flex w-full max-w-[650px] flex-col bg-[#f7f9fc] shadow-xl"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="'sheets.evaluation.title' | t"
>
  <header class="flex items-start justify-between gap-3 border-b bg-white p-5">
    <div>
      <h2 class="text-[20px] font-bold">{{ "sheets.evaluation.title" | t }}</h2>
      <p class="mt-1 text-[13px] text-[#64748b]">{{ studentName() }}</p>
    </div>
    <button
      type="button"
      (click)="close()"
      class="rounded-[11px] border p-2"
      [attr.aria-label]="'sheets.evaluation.close' | t"
    >
      <i class="ph ph-x"></i>
    </button>
  </header>
  <div class="min-h-0 flex-1 space-y-4 overflow-y-auto p-5">
    <p class="rounded-[11px] border bg-white p-3 text-[13px] text-[#475569]">
      {{ "sheets.real.savedFields" | t }}
    </p>
    <label class="block text-[13px] font-semibold">
      {{ "sheets.evaluation.sheet" | t }}
      <select
        [value]="topicId() || ''"
        (change)="selectTopic($event)"
        class="mt-1 block w-full rounded-[11px] border bg-white px-3 py-2"
      >
        @for (topic of topics(); track topic.topicId) {
          <option [value]="topic.topicId">
            {{ topic.number ?? topic.code }} · {{ topic.title }}
          </option>
        }
      </select>
    </label>
    @if (selectedTopic()) {
      <label class="block text-[13px] font-semibold">
        {{ "sheets.table.status" | t }}
        <select
          [value]="status()"
          (change)="setStatus($event)"
          class="mt-1 block w-full rounded-[11px] border bg-white px-3 py-2"
        >
          @for (option of statuses; track option) {
            <option [value]="option">
              {{ "sheets.status." + option | t }}
            </option>
          }
        </select>
      </label>
      <div class="grid gap-3 sm:grid-cols-2">
        <label class="block text-[13px] font-semibold">
          {{ "sheets.table.prepared" | t }}
          <input
            type="date"
            [value]="preparationDate()"
            (input)="setField('preparationDate', $event)"
            class="mt-1 block w-full rounded-[11px] border bg-white px-3 py-2"
          />
        </label>
        <label class="block text-[13px] font-semibold">
          {{ "sheets.table.presented" | t }}
          <input
            type="date"
            [value]="presentationDate()"
            (input)="setField('presentationDate', $event)"
            class="mt-1 block w-full rounded-[11px] border bg-white px-3 py-2"
          />
        </label>
        <label class="block text-[13px] font-semibold">
          {{ "sheets.evaluation.duration" | t }}
          <input
            type="number"
            min="1"
            max="1440"
            [value]="duration()"
            (input)="setField('duration', $event)"
            class="mt-1 block w-full rounded-[11px] border bg-white px-3 py-2"
          />
        </label>
      </div>
      <label class="block text-[13px] font-semibold">
        {{ "sheets.evaluation.generalComment" | t }}
        <textarea
          rows="6"
          maxlength="2000"
          [value]="comment()"
          (input)="setField('comment', $event)"
          class="mt-1 block w-full rounded-[11px] border bg-white px-3 py-2"
        ></textarea>
      </label>
      @if (invalid()) {
        <p
          role="alert"
          class="rounded-[11px] bg-red-50 p-3 text-[13px] text-red-700"
        >
          {{ "sheets.real.invalid" | t }}
        </p>
      }
      @if (error()) {
        <p
          role="alert"
          class="rounded-[11px] bg-red-50 p-3 text-[13px] text-red-700"
        >
          {{ "sheets.real.saveFailed" | t }}
        </p>
      }
    } @else {
      <p role="status" class="text-[13px]">{{ "sheets.real.noTopics" | t }}</p>
    }
  </div>
  <footer class="flex justify-end gap-2 border-t bg-white p-4">
    <button
      type="button"
      (click)="close()"
      [disabled]="saving()"
      class="rounded-[11px] border px-4 py-2 text-[13px]"
    >
      {{ "sheets.evaluation.cancel" | t }}
    </button>
    <button
      type="button"
      (click)="save()"
      [disabled]="saving() || !selectedTopic()"
      class="rounded-[11px] bg-[#2b66a4] px-4 py-2 text-[13px] font-semibold text-white disabled:opacity-50"
    >
      {{ (saving() ? "sheets.real.saving" : "sheets.evaluation.save") | t }}
    </button>
  </footer>
</aside>
