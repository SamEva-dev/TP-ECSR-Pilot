@if (open()) {
  <button type="button" class="fixed inset-0 z-50 bg-[#0b1727]/35 backdrop-blur-[1px]" (click)="closed.emit()" [attr.aria-label]="'common.close' | t"></button>
  <aside class="fixed inset-y-0 right-0 z-[60] w-full max-w-[560px] overflow-y-auto bg-[#f7f9fc] shadow-[-24px_0_65px_rgba(17,37,63,0.18)]">
    <header class="sticky top-0 z-10 flex items-start justify-between gap-4 border-b border-[#dfe5ec] bg-white px-6 py-5">
      <div><p class="text-[11px] font-semibold uppercase tracking-[0.08em] text-[#2a64a2]">{{ 'referentials.versionDrawer.eyebrow' | t }}</p><h2 class="mt-1 text-[21px] font-extrabold text-[#172033]">{{ 'referentials.versionDrawer.title' | t }}</h2><p class="mt-1 text-[12px] text-[#748095]">{{ 'referentials.versionDrawer.subtitle' | t }}</p></div>
      <button type="button" (click)="closed.emit()" class="grid size-9 shrink-0 place-items-center rounded-[11px] border border-[#d8e0e9] bg-white text-[#667085]"><i class="ph ph-x text-[18px]"></i></button>
    </header>
    <div class="space-y-4 p-6">
      <label class="block"><span class="mb-2 block text-[12px] font-semibold">{{ 'referentials.versionDrawer.program' | t }}</span><select [value]="effectiveProgramId()" (change)="setProgram($event)" class="h-11 w-full rounded-[11px] border border-[#d8e0e9] bg-white px-3 text-[12.5px] outline-none">@for (program of programs; track program.id) {<option [value]="program.id">{{ program.name }}</option>}</select></label>
      <label class="block"><span class="mb-2 block text-[12px] font-semibold">{{ 'referentials.versionDrawer.source' | t }}</span><select [value]="sourceId() || defaultSourceId()" (change)="setSource($event)" class="h-11 w-full rounded-[11px] border border-[#d8e0e9] bg-white px-3 text-[12.5px] outline-none">@for (item of sources(); track item.id) {<option [value]="item.id">{{ item.version }} · {{ item.code }}</option>}</select><span class="mt-1.5 block text-[10.5px] text-[#8490a3]">{{ 'referentials.versionDrawer.sourceHint' | t }}</span></label>
      <div class="grid gap-4 sm:grid-cols-2"><label class="block"><span class="mb-2 block text-[12px] font-semibold">{{ 'referentials.versionDrawer.version' | t }}</span><input type="text" [value]="version()" (input)="setVersion($event)" class="h-11 w-full rounded-[11px] border border-[#d8e0e9] bg-white px-3 text-[12.5px] outline-none focus:border-[#9ab8d7] focus:ring-2 focus:ring-blue-100" /></label><label class="block"><span class="mb-2 block text-[12px] font-semibold">{{ 'referentials.versionDrawer.code' | t }}</span><input type="text" [value]="code()" (input)="setCode($event)" class="h-11 w-full rounded-[11px] border border-[#d8e0e9] bg-white px-3 text-[12.5px] outline-none focus:border-[#9ab8d7] focus:ring-2 focus:ring-blue-100" /></label></div>
      <div class="grid gap-4 sm:grid-cols-2"><label class="block"><span class="mb-2 block text-[12px] font-semibold">{{ 'referentials.versionDrawer.effectiveFrom' | t }}</span><input type="date" [value]="effectiveFrom()" (input)="setEffectiveFrom($event)" class="h-11 w-full rounded-[11px] border border-[#d8e0e9] bg-white px-3 text-[12.5px] outline-none" /></label><label class="block"><span class="mb-2 block text-[12px] font-semibold">{{ 'referentials.versionDrawer.status' | t }}</span><select [value]="status()" (change)="setStatus($event)" class="h-11 w-full rounded-[11px] border border-[#d8e0e9] bg-white px-3 text-[12.5px] outline-none"><option value="draft">{{ 'referentials.status.draft' | t }}</option><option value="active">{{ 'referentials.status.active' | t }}</option></select></label></div>
      <div class="rounded-[14px] border border-[#cfe0f0] bg-[#edf5fc] p-4 text-[11.5px] leading-[1.55] text-[#49657f]"><i class="ph ph-info mr-1 text-[#2a64a2]"></i>{{ 'referentials.versionDrawer.info' | t }}</div>
    </div>
    <footer class="sticky bottom-0 flex justify-end gap-2 border-t border-[#dfe5ec] bg-white px-6 py-4"><button type="button" (click)="closed.emit()" class="h-10 rounded-[11px] border border-[#d8e0e9] px-4 text-[12px] font-semibold text-[#667085]">{{ 'common.cancel' | t }}</button><button type="button" (click)="submit()" class="h-10 rounded-[11px] bg-[#2b66a4] px-5 text-[12px] font-semibold text-white">{{ 'referentials.versionDrawer.create' | t }}</button></footer>
  </aside>
}
